{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoodVerse Journal 💗</title>
<link rel="stylesheet" href="{% static 'moodverse/style.css' %}">
</head>


<body class="journal-page">


<div class="floating-stickers">

<span>🌸</span>
<span>💗</span>
<span>✨</span>
<span>🧸</span>

</div>



<header class="navbar">


<h1>
🌈 MoodVerse
</h1>


<nav>

<a href="/home/">
Home
</a>


<a href="/mood/">
Mood
</a>


<a href="/dashboard/">
Dashboard
</a>


</nav>


</header>





<section class="journal-container">


<div class="journal-card">


<h2>
Dear Diary 💌
</h2>


<p>
Write whatever is on your mind today.
</p>



<div class="mood-choice">


<h3>
How are you feeling?
</h3>


<button type="button" onclick="selectJournalMood('😊', 'happy')">
😊
</button>


<button type="button" onclick="selectJournalMood('😌', 'calm')">
😌
</button>


<button type="button" onclick="selectJournalMood('😢', 'sad')">
😢
</button>


<button type="button" onclick="selectJournalMood('😡', 'angry')">
😡
</button>


<button type="button" onclick="selectJournalMood('🤩', 'excited')">
🤩
</button>


</div>



<textarea
    id="journal-text"
    placeholder="Write your thoughts here... 💭">
</textarea>




<button
    class="save-btn"
    type="button"
    onclick="saveJournalMemory()">

Save Memory 💗

</button>



<p id="journal-message" class="journal-message"></p>



</div>


</section>





<footer>

Made with 💕 by MoodVerse

</footer>


<script src="{% static 'moodverse/script.js' %}"></script>

</body>

</html>
